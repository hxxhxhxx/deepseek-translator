name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/DeepSeekTranslator/DeepSeekTranslator.csproj -c Release

      - name: Core smoke tests
        run: dotnet run --project tests/CoreSmoke/CoreSmoke.csproj -c Release
